name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Closure Compiler Build
        run: make build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Glossary Traceability Verification
        run: npm run test:traceability

      - name: Run Glossary Quality Audit v4.0
        run: npm run test:audit

      - name: Run CLI Quiz Runner Test
        run: npm run test:quiz

      - name: Run Custom Search Engine Index Test
        run: npm run test:search
