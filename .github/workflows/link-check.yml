name: Markdown Link Check CI

on:
  pull_request:
    branches:
      - main

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run Relative Path Check Script
        run: |
          python3 scripts/check_relative_paths.py

      - name: Lychee Broken Link Checker
        uses: lycheeverse/lychee-action@f791830206fa1a1b18d2036495b9d3b4e6b1d4ef # v1.9.0
        with:
          args: --verbose --no-progress './docs/**/*.md' './project-docs/**/*.md' './issues/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
