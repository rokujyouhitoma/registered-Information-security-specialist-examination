site_name: 情報処理安全確保支援士試験 対策ドキュメント & ナレッジベース
site_description: IPA情報処理安全確保支援士試験 (SC) のシラバスVer.2.1および科目A-2追補版Ver.4.0に準拠した総合学習資料
site_author: Deepmind Antigravity Security Team

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードへ切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードへ切り替え
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - ホーム: index.md
  - 🔍 総合検索: search.md
  - 🧠 演習クイズ: quiz.md
  - シラバス体系:
      - シラバス概要: syllabus.md
      - 公式シラバス Ver.2.1 詳細: syllabus_detail.md
      - 科目A-2 追補版 Ver.4.0 詳細: syllabus_tsuiho_detail.md
  - 📚 総合用語辞書 (Glossary):
      - 用語インデックス: glossary/index.md
      - シラバスVer.2.1 用語辞書: glossary/syllabus_ver2_1.md
      - 追補版Ver.4.0 用語辞書: glossary/syllabus_tsuiho_ver4_0.md
      - 重要技術・アーキテクチャ詳細解説 (ST/SA):
          - ゼロトラスト・アーキテクチャ: glossary/terms/zero-trust.md
          - TLS 1.3 トランスポート層セキュリティ: glossary/terms/tls1_3.md
          - 公開鍵インフラストラクチャ (PKI): glossary/terms/pki.md
          - OAuth 2.0 & OpenID Connect: glossary/terms/oauth2-oidc.md
          - 送信ドメイン認証 (SPF/DKIM/DMARC): glossary/terms/email-security.md
  - 🎯 科目B対策・事例解析:
      - 科目B 解法思考プロセスガイド: subject_b/reasoning_guide.md
      - サイバー攻撃・解析シナリオ: scenarios/attack_scenarios_analysis.md
      - ハンズオン インシデント解析: scenarios/hands_on_incident_analysis.md
  - 📖 試験対策ガイド:
      - 試験概要: exam_overview.md
      - ITSS 到達度セルフチェック: itss_self_assessment_guide.md
